[project]
name = "svg2png-cli"
version = "0.1.1"
description = "Convert SVG to PNG from the command line (resvg-py backend — no Cairo/Inkscape needed on Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jefferson Gonçalves", email = "gerson.simao.92@gmail.com" }]
dependencies = ["resvg-py"]
keywords = ["svg", "png", "cli", "convert", "resvg"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/jeffersongoncalves/svg2png-cli"
Repository = "https://github.com/jeffersongoncalves/svg2png-cli"
Issues = "https://github.com/jeffersongoncalves/svg2png-cli/issues"
Changelog = "https://github.com/jeffersongoncalves/svg2png-cli/releases"

[project.scripts]
svg2png = "svg2png_cli.cli:main"

[build-system]
requires = ["setuptools>=69.3"]
build-backend = "setuptools.build_meta"
